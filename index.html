<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Great Sauna Race</title>
<meta name="description" content="6 friends, 24 hours, one free sauna. Sign up on Luma.">
<meta name="theme-color" content="#14100E">
<link rel="canonical" href="https://luma.com/vwvmpjfg">
<!-- GitHub Pages can't serve a real 301, so this is the three-layer version:
     JS replace (instant, leaves no back-button trap), meta refresh (JS off),
     and a visible link (both blocked). -->
<meta http-equiv="refresh" content="0; url=https://luma.com/vwvmpjfg">
<script>location.replace("https://luma.com/vwvmpjfg");</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#FFF3E4; --ink-dim:#C9AF97; --ember:#FF6B2C; --char:#14100E;
    --display:'Anton','Haettenschweiler','Impact',sans-serif;
    --body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100svh; background:var(--char); color:var(--ink);
    font-family:var(--body); display:flex; align-items:center;
    justify-content:center; text-align:center; padding:32px;
  }
  h1{
    font-family:var(--display); text-transform:uppercase; font-weight:400;
    font-size:clamp(2rem,9vw,3.4rem); line-height:.95; margin:0 0 18px;
  }
  p{color:var(--ink-dim); margin:0 0 26px; line-height:1.6}
  a.go{
    display:inline-block; background:var(--ember); color:var(--char);
    font-family:var(--display); text-transform:uppercase; letter-spacing:.04em;
    font-size:1.15rem; text-decoration:none; padding:15px 30px; border-radius:2px;
  }
</style>
</head>
<body>
  <main>
    <h1>The Great<br>Sauna Race</h1>
    <p>We've moved sign-ups to Luma.<br>Taking you there now.</p>
    <a class="go" href="https://luma.com/vwvmpjfg">Go to the sign-up page &nearr;</a>
  </main>
</body>
</html>
